name: Bug report
description: Report a reproducible Murmur problem without sharing private content.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue and its attachments are PUBLIC. Do not post transcripts, recordings, clipboard contents, keys, logs with personal data, or unredacted diagnostics. Use synthetic examples. For vulnerabilities use SECURITY.md's private route, not this form.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic content; describe actions, not captured speech or actual meeting data.
      placeholder: "1. Open Settings…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What did you expect and what happened? No private content.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App version/commit, macOS version and Apple Silicon model (no serial number or username).
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic examples and removed transcripts, recordings, keys, personal data and unredacted diagnostics.
          required: true
