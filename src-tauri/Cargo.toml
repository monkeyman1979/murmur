[package]
name = "murmur"
version = "0.1.0"
description = "Murmur — local-first voice dictation for macOS"
authors = ["monkeyman1979"]
edition = "2021"
default-run = "murmur"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[features]
# Meeting capture is part of the shipping macOS application. Its Core Audio
# dependencies are isolated from the developer-only inspector/diagnostic path.
default = ["meeting-capture"]
meeting-capture = [
  "dep:objc2-core-audio",
  "dep:objc2-core-audio-types",
  "dep:objc2-core-foundation",
]
# Explicit debug-only tooling. Never enable this feature for a release profile;
# build.rs enforces that invariant.
meeting-capture-debug = ["meeting-capture", "tauri/devtools"]

[dependencies]
tauri = { version = "=2.11.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs", "io-util"] }
cpal = "0.15"
hound = "3.5"
# whisper-rs is declared per-target below: Metal on macOS, portable CPU
# backend elsewhere so Ubuntu CI doesn't try to link Apple Foundation.
parking_lot = "0.12"
reqwest = { version = "=0.12.28", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false }
arboard = { version = "3", default-features = false }
regex = "1"
# Frontmatter stays UTC; user-facing filenames use the Mac's local wall clock
# to match the timestamp shown in Murmur's default meeting title.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Atomic no-replace rename on macOS/Linux prevents collision races from
# overwriting an unrelated transcript file.
rustix = { version = "1", features = ["fs"] }
# SQLite for history / stats (SPEC §2.8 / §2.9). `bundled` compiles
# libsqlite3 from the included source so we don't depend on whatever
# vintage of sqlite the host OS ships — offline-first invariant and
# reproducible builds both require this. FTS5 is on by default in
# the bundled build; we use it for `/history` search.
rusqlite = { version = "0.32", features = ["bundled"] }
# Streaming SHA-256 for registry pins. Listing it as a direct dependency
# makes the verification path in `model_download.rs` explicit and
# version-stable. Pure-Rust (no OpenSSL) so the
# offline-first / reproducible-builds invariant holds. `asm` enables
# ARMv8 SHA-256 crypto extensions on Apple Silicon — ~5-10x speedup
# over the software SIMD fallback for the `verify_model` path. No-op on targets without the
# crypto extensions.
sha2 = { version = "0.10", features = ["asm"] }
# CPU ONNX Runtime 1.28.0; ort-sys pins and SHA-256-verifies its static build artifact.
# No runtime downloads or dynamic dylib search. Explicitly exclude GPU providers.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
# OS-backed CSPRNG used by runtime temporary-file/report identifiers.
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-updater = "=2.10.0"
tauri-plugin-process = "=2.3.1"

[dev-dependencies]
# Parse the production entitlement plist structurally in policy tests.
plist = "=1.10.1"
# Used by benchmark examples only; neither dependency changes the shipping app.
# libc reads process peak RSS. whisper-cpp-log lets the private quality runner
# suppress native model-path logs by routing them to an unconfigured Rust facade.
libc = "0.2"
whisper-rs = { version = "0.13", features = ["whisper-cpp-log"] }

# whisper-rs-sys 0.11.1's bundled ggml Metal initializer leaks one owned
# shader-source NSString (~384 KiB) and one MTLCompileOptions per context load.
# Murmur intentionally unloads/reloads Whisper around dictations, so that
# upstream leak otherwise ratchets idle memory upward. Keep this narrow vendor
# patch until whisper-rs publishes a sys crate containing the upstream releases.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

# Build scripts and proc macros run on the build host. Keep them unoptimized
# separately from runtime crates: with Rust 1.95 on macOS, a shared optimized
# proc-macro dylib can be rejected as an incompatible dependency (E0463).
# Do not strip host proc-macro dylibs: on this Xcode/macOS toolchain stripping
# corrupts their LINKEDIT string pool, and dyld refuses to load them.
[profile.release.build-override]
opt-level = 0
strip = "none"

[[example]]
name = "meeting_transcript_quality_bench"
path = "examples/meeting_transcript_quality_bench.rs"
test = true

[[test]]
name = "macos_pasteboard_main_thread"
path = "tests/macos_pasteboard_main_thread.rs"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13", features = ["metal"] }
coreaudio-sys = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = { version = "0.3", features = ["objc2-core-services"] }
# Needed for AVCaptureDevice.requestAccess completion-handler block.
# Only pulled in on macOS since it's the only platform with TCC.
block2 = "0.6"
# Core Audio process taps (macOS 14.2+): CATapDescription,
# AudioHardwareCreateProcessTap, AudioHardwareCreateAggregateDevice, IOProcs.
objc2-core-audio = { version = "0.3.2", optional = true, default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.13"

